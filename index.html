    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8f9fa;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .container img {
            width: 100%;
            max-width: 450px;
            height: auto;
            display: block;
            margin: 0 auto 25px;
        }

        h1 {
            font-size: 32px;
            color: #222;
            margin-bottom: 12px;
        }

        p {
            font-size: 16px;
            color: #777;
        }

        @media (max-width: 600px) {
            .container img {
                max-width: 320px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
